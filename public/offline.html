<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2A5E" />
    <title>Offline · KBS School</title>
    <link rel="icon" href="/logo-64.png" type="image/png" />
    <link rel="stylesheet" href="/css/base.css" />
    <style>
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; background: #0a2a5e; color: #fff; text-align: center; }
      main { max-width: 360px; }
      img { width: 96px; height: 96px; }
      h1 { margin: 18px 0 8px; font-family: var(--serif); font-size: 26px; }
      p { margin: 0 0 22px; color: #c9d8f2; line-height: 1.5; }
      button { height: 50px; padding: 0 26px; border: 0; border-radius: 12px; background: #f2b632; color: #0a2a5e; font: 700 16px var(--sans); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-192.png" alt="" />
      <h1>You are offline</h1>
      <p>KBS School needs the internet to show up-to-date fees, attendance and records. Check your connection and try again.</p>
      <form method="get"><button type="submit">Try again</button></form>
    </main>
  </body>
</html>
